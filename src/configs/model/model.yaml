_target_: src.model.HiFiPlusPlusGAN  
generator_config:
  upsample_block_rates: [2]
  upsample_block_kernel_sizes: [4]

  residual_channels: 64
  bsft_channels: 64
  nwstack1_blocks: 1
  nwstack2_blocks: 1

  use_waveunet: False
  waveunet_block_widths: [4, 8, 16]
  waveunet_block_depth: 3

  use_postnet: True
  postnet_channels: 16
  postnet_num_mrf: 1
  postnet_kernel_sizes: [3, 7]
  postnet_dilations: [[1, 3, 5], [1, 3, 5]]
  postnet_final_activation: "softclip"

  norm_type: "weight"
  use_skip_connect: True
  waveunet_input: "both"
  waveunet_channels: 2

  convnext_dim: 513
  num_layers_convnext_real: 1
  num_layers_convnext_imag: 1
  intermediate_dim_convnext: 1536

mpd_config: 
  periods: [2, 3, 5, 7, 11]
  kernel_size: 5
  stride: 3
  channels: [1, 32, 128, 512, 1024]

msd_config: 
  num_blocks: 3
  kernel_sizes: [15, 41, 41, 41, 41, 41, 5]
  strides: [1, 2, 2, 4, 4, 1, 1]
  groups: [1, 4, 16, 16, 16, 16, 1]
  channels: [1, 128, 128, 256, 512, 1024, 1024, 1024]
